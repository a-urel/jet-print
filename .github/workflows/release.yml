name: Release

# Creates the GitHub Release for a pushed `jet_print-vX.Y.Z` tag, with notes
# written from that version's CHANGELOG section by
# packages/jet_print/tool/release_notes.dart (docs/workflow.md, "Releasing").
# Releases used to be written by hand, and 0.2.0, 1.0.0 and 1.1.0 reached
# pub.dev without one: nothing failed when a tag got no release. A tag that
# already has one is left alone, so re-pushing a tag, or one released by hand,
# changes nothing. The job fails, and creates no release, when the CHANGELOG
# has no section for the version or pubspec.yaml declares another one.
on:
  push:
    tags:
      - "jet_print-v*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    # The token is handed only to the steps that call `gh`, not to the ones
    # that resolve packages and run Dart.
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already has a GitHub Release; leaving it as it is."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Warn on a lightweight tag
        if: steps.existing.outputs.exists == 'false'
        # Read from the API rather than the checkout, which can rewrite an
        # annotated tag as it fetches.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.type)
          if [ "$type" != "tag" ]; then
            echo "::warning::$TAG is a lightweight tag. Release tags are annotated: git tag -a $TAG -m \"jet_print ${TAG#jet_print-v}\"."
          fi

      - name: Check out the repository
        if: steps.existing.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          # Every tag, to find the one this release compares with.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        if: steps.existing.outputs.exists == 'false'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Resolve workspace dependencies
        if: steps.existing.outputs.exists == 'false'
        run: flutter pub get --enforce-lockfile

      - name: Write the release notes
        id: notes
        if: steps.existing.outputs.exists == 'false'
        working-directory: packages/jet_print
        run: dart run tool/release_notes.dart "$TAG" "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"

      - name: Create the release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.notes.outputs.title }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest=false "${flags[@]}"

      - name: Mark the highest release Latest
        # Latest is the highest stable release GitHub holds, read back from
        # it rather than taken from this run's tags: a higher tag may have no
        # release yet, and two tags pushed together run side by side, the
        # older one's run perhaps finishing last. Each run re-reads after it
        # writes, so whichever finishes last leaves Latest on the highest
        # release; a backport re-marks the release that already is. (A
        # concurrency group would serialize the runs instead, but it keeps at
        # most one waiting and cancels the rest, dropping their releases.)
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          highest() {
            gh release list --limit 1000 --exclude-drafts --exclude-pre-releases \
              --json tagName --jq '.[].tagName |
                select(test("^jet_print-v[0-9]+\\.[0-9]+\\.[0-9]+(\\+[0-9A-Za-z.-]+)?$"))' |
              sort -V | tail -n 1
          }
          target=$(highest)
          if [ -z "$target" ]; then
            echo "No stable release yet; Latest is unchanged."
            exit 0
          fi
          while [ -n "$target" ]; do
            gh release edit "$target" --latest
            now=$(highest)
            if [ "$now" = "$target" ]; then break; fi
            target=$now
          done
          echo "Latest is $target."
