name: CI

# Mirrors the local quality gate (README "Test & quality gate") across the
# three desktop platforms (E3). macOS is canonical: it alone runs the full
# suite (including goldens) and the dart format gate; Ubuntu and Windows run
# the suite with the golden surface excluded. Every leg builds the playground
# app to prove the native plugin toolchain links per-OS.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_goldens:
        description: >-
          Regenerate the goldens that fail on macOS and upload them as an
          artifact (runs only the update-goldens job)
        type: boolean
        default: false

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    if: ${{ !inputs.update_goldens }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_target: macos
            test_filter: ""
            canonical: true
          - os: ubuntu-latest
            build_target: linux
            test_filter: "--exclude-tags golden"
            canonical: false
          - os: windows-latest
            build_target: windows
            test_filter: "--exclude-tags golden"
            canonical: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libcups2-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        if: matrix.canonical
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze (zero warnings)
        run: flutter analyze

      - name: Build the playground app
        working-directory: apps/jet_print_playground
        run: flutter build ${{ matrix.build_target }} --debug

      - name: Run tests
        # `flutter test` at a workspace root does not fan out to members, so the
        # member packages are listed explicitly. Off-canonical jobs exclude the
        # golden surface (host rasterization / PDF subsetting differs per OS).
        run: flutter test ${{ matrix.test_filter }} packages/jet_print apps/jet_print_playground

  web:
    name: web (chrome)
    if: ${{ !inputs.update_goldens }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build the playground for web
        working-directory: apps/jet_print_playground
        run: flutter build web

      - name: Run the Chrome test leg (goldens + VM-only tests excluded)
        # Per-package: the repo-root multi-package `--platform chrome` command
        # fails on DDC workspace path resolution (Task 2 finding). Run each
        # member from its own dir.
        run: |
          (cd packages/jet_print && flutter test --platform chrome --exclude-tags golden)
          (cd apps/jet_print_playground && flutter test --platform chrome --exclude-tags golden)

  android:
    name: android (apk)
    if: ${{ !inputs.update_goldens }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Resolve workspace dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build the playground APK
        working-directory: apps/jet_print_playground
        run: flutter build apk --debug

  ios:
    name: ios (no codesign)
    if: ${{ !inputs.update_goldens }}
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Resolve workspace dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build the playground for iOS
        working-directory: apps/jet_print_playground
        run: flutter build ios --debug --no-codesign

  update-goldens:
    # Manual only (Run workflow -> update_goldens). Goldens are canonical on
    # macOS, so a change that moves one has to be regenerated here. Follows
    # docs/recipes/update-goldens.md: run the golden suite, regenerate only the
    # files that fail, one test file at a time, and upload the new PNGs with
    # the failure images (master/test/diff) for review. Nothing is committed:
    # someone looks at the images, names what moved, and commits them.
    name: update goldens (macos)
    if: ${{ inputs.update_goldens }}
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run the golden suite and list the failing test files
        shell: bash
        run: |
          set +e
          flutter test --tags golden --reporter expanded \
            packages/jet_print apps/jet_print_playground 2>&1 | tee golden-run.log
          status=${PIPESTATUS[0]}
          set -e
          grep -E '\[E\]$' golden-run.log \
            | grep -oE '(packages|apps)/[^ :]+_test\.dart' \
            | sort -u > failing-goldens.txt || true
          echo "Failing golden test files:"
          cat failing-goldens.txt
          # A run that fails without naming a test (a compile error, a crash
          # before any test) has nothing to regenerate: fail loudly instead
          # of uploading an empty artifact.
          if [ "$status" -ne 0 ] && [ ! -s failing-goldens.txt ]; then
            echo "The golden suite failed without a failing test file."
            exit 1
          fi

      - name: Keep the failure images, then regenerate the failing files
        shell: bash
        run: |
          mkdir -p golden-updates
          # Keep each failures/ directory at its own path: two test
          # directories may produce failure images with the same names.
          find packages apps -type d -name failures | while read -r dir; do
            mkdir -p "golden-updates/$(dirname "$dir")"
            cp -R "$dir" "golden-updates/$dir"
          done
          while read -r test_file; do
            [ -n "$test_file" ] && flutter test --update-goldens "$test_file"
          done < failing-goldens.txt
          git status --porcelain -- 'packages/*.png' 'apps/*.png' \
            | awk '{print $2}' > changed-goldens.txt
          echo "Regenerated:"
          cat changed-goldens.txt
          while read -r png; do
            [ -n "$png" ] && mkdir -p "golden-updates/$(dirname "$png")" \
              && cp "$png" "golden-updates/$png"
          done < changed-goldens.txt
          cp golden-run.log failing-goldens.txt changed-goldens.txt golden-updates/

      - name: Confirm the regenerated goldens pass without the flag
        # Recipe step 6: a regeneration that still fails a plain comparison
        # (or breaks a passing golden) must not look like a usable artifact.
        run: flutter test --tags golden packages/jet_print apps/jet_print_playground

      - name: Upload the regenerated goldens
        # Even when the check above fails: the images are what explains it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-updates
          path: golden-updates/
